# This is a basic workflow to help you get started with Actions

name: unit-tests

# Controls when the workflow will run
on:
  pull_request:
    paths:
      - tencentcloud/**
      - examples/tencentcloud-cos-vector-bucket/**
      - .github/workflows/unit-tests.yml
      - go.mod
      - go.sum
      - vendor/**

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  unit-tests:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # Runs a set of commands using the runners shell
      - name: unit
        run: go test -v ./tencentcloud -test.run 'TestProvider'

      # Verify SDKv2 + framework provider mux compatibility (no schema clash,
      # no duplicate resource/data source type names across stacks).
      - name: mux compatibility
        run: make check-mux

  cosvectors:
    name: COS Vectors unit and Terraform lifecycle tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Test COS Vectors without cloud credentials
        env:
          CHECKPOINT_DISABLE: "1"
          TENCENTCLOUD_COS_VECTOR_LOCAL_TEST: "1"
          GOPROXY: "off"
          GOSUMDB: "off"
        run: |
          export TF_ACC_TERRAFORM_PATH="$(command -v terraform)"
          go test -mod=vendor -p 2 ./tencentcloud/connectivity ./tencentcloud/ratelimit ./tencentcloud/services/cosvectors -run '^(TestCosVector|TestProCheckContext|TestCheckContext)' -count=1 -timeout=5m
